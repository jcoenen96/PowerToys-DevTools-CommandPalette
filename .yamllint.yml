# yamllint (run by MegaLinter).
extends: default
ignore: |
  node_modules/
rules:
  document-start: disable
  truthy:
    check-keys: false # GitHub Actions' "on:"
  line-length:
    max: 120
    level: warning # URLs can't be wrapped
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
