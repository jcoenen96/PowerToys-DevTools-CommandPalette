name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Betterleaks scans the history of the pushed commits.
          fetch-depth: 0
      - name: Lint and analyze everything
        # Configured in .mega-linter.yml: CSharpier, the .NET analyzers, secret and vulnerability scans,
        # and the YAML, Markdown, shell and workflow linters.
        uses: oxsecurity/megalinter/flavors/dotnet@v9
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload MegaLinter reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: megalinter-reports/
          if-no-files-found: ignore

  core:
    name: Domain, application and infrastructure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Unit and integration tests
        # The infrastructure tests create real git repositories and worktrees in a temp folder.
        run: dotnet test DevTools.Core.slnf --logger "console;verbosity=normal"

  extension:
    name: Build extension (${{ matrix.platform }})
    runs-on: windows-latest
    needs: version
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Build
        run: >-
          dotnet build src/DevTools.CommandPalette/DevTools.CommandPalette.csproj
          -c Release -p:Platform=${{ matrix.platform }} -p:CI=true
          -p:Version=${{ needs.version.outputs.semver }}

  extension-tests:
    name: Extension tests on PowerToys
    # Runs the extension's integration tests in process, then installs PowerToys, deploys the extension with
    # scripts/Deploy-Extension.ps1 and tests the installed extension over COM, the way Command Palette uses it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Integration tests (in process)
        run: >-
          dotnet test tests/DevTools.CommandPalette.Tests/DevTools.CommandPalette.Tests.csproj
          -p:Platform=x64 -p:CI=true --logger "console;verbosity=normal"
      - name: Install PowerToys, turn on Developer Mode
        uses: ./.github/actions/powertoys
      - name: A repository to list
        shell: pwsh
        run: |
          $repo = Join-Path $env:USERPROFILE 'source\repos\Sample'
          New-Item -ItemType Directory -Force $repo | Out-Null
          git -C $repo init --initial-branch=main --quiet
          Set-Content (Join-Path $repo 'Sample.slnx') '<Solution />'
      - name: Deploy the extension
        shell: pwsh
        run: ./scripts/Deploy-Extension.ps1 -Platform x64 -NoReload
      - name: Integration tests (installed extension)
        env:
          DEVTOOLS_PACKAGED_TESTS: "1"
        run: >-
          dotnet test tests/DevTools.CommandPalette.Tests/DevTools.CommandPalette.Tests.csproj
          -p:Platform=x64 --no-build --filter "FullyQualifiedName~PackagedExtensionTests"
          --logger "console;verbosity=normal"

  container-build:
    name: Build extension in the dev container (${{ matrix.engine }})
    # scripts/Deploy-FromContainer.ps1, split over two runners: the Linux runner builds in the dev container, the
    # Windows runner (which can't run Linux containers) makes resources.pri, deploys and tests the build.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev container image
        run: ${{ matrix.engine }} build --tag devtools-commandpalette-dev .devcontainer
      - name: Build the extension in the dev container
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          # The container runs as its own user (vscode), which has to write bin/, obj/ and artifacts/. Docker:
          # let everyone write. Rootless Podman: run vscode as the runner's user, as Deploy-FromContainer.ps1 does.
          if [ "$ENGINE" = docker ]; then
            chmod -R a+rwX .
            user_args=()
          else
            user_args=("--userns=keep-id:uid=1000,gid=1000")
          fi
          "$ENGINE" run --rm "${user_args[@]}" --volume "$PWD:/workspaces/repo" --workdir /workspaces/repo \
            devtools-commandpalette-dev \
            dotnet build src/DevTools.CommandPalette/DevTools.CommandPalette.csproj -p:Platform=x64 --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: container-build-${{ matrix.engine }}
          path: |
            src/DevTools.CommandPalette/bin/
            src/DevTools.CommandPalette/obj/
            artifacts/container/
          if-no-files-found: error

  container-deploy:
    name: Deploy the dev container build on PowerToys (${{ matrix.engine }})
    runs-on: windows-latest
    needs: container-build
    strategy:
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Build the packaged tests
        # Builds the extension on Windows too (a project reference); its output is replaced by the container build
        # below, and the tests run with --no-build.
        run: >-
          dotnet build tests/DevTools.CommandPalette.Tests/DevTools.CommandPalette.Tests.csproj
          -p:Platform=x64 -p:CI=true
      - name: Install PowerToys, turn on Developer Mode
        uses: ./.github/actions/powertoys
      - name: Deploy the Windows build first, with a setting to keep
        # Replacing a Windows build with a container build in the same folder is what a developer who switches
        # does; Windows refuses that in-place update (0x80073CFB) and Deploy-Extension.ps1 reinstalls instead.
        shell: pwsh
        run: |
          ./scripts/Deploy-Extension.ps1 -Platform x64 -SkipBuild -NoReload
          $package = Get-AppxPackage -Name DevTools.CommandPalette
          $localState = Join-Path $env:LOCALAPPDATA "Packages/$($package.PackageFamilyName)/LocalState"
          New-Item -ItemType Directory -Force $localState | Out-Null
          Set-Content (Join-Path $localState 'kept.txt') 'kept'
      - name: Replace the extension with the container build
        shell: pwsh
        run: Remove-Item -Recurse -Force src/DevTools.CommandPalette/bin, src/DevTools.CommandPalette/obj
      - uses: actions/download-artifact@v4
        with:
          name: container-build-${{ matrix.engine }}
      - name: A repository to list
        shell: pwsh
        run: |
          $repo = Join-Path $env:USERPROFILE 'source\repos\Sample'
          New-Item -ItemType Directory -Force $repo | Out-Null
          git -C $repo init --initial-branch=main --quiet
          Set-Content (Join-Path $repo 'Sample.slnx') '<Solution />'
      - name: Deploy the container build
        shell: pwsh
        run: |
          ./scripts/Deploy-FromContainer.ps1 -Platform x64 -SkipBuild -NoReload
          $package = Get-AppxPackage -Name DevTools.CommandPalette
          $kept = Join-Path $env:LOCALAPPDATA "Packages/$($package.PackageFamilyName)/LocalState/kept.txt"
          if (-not (Test-Path $kept)) { throw 'The settings were not kept across the reinstall.' }
      - name: Integration tests (installed extension)
        env:
          DEVTOOLS_PACKAGED_TESTS: "1"
        run: >-
          dotnet test tests/DevTools.CommandPalette.Tests/DevTools.CommandPalette.Tests.csproj
          -p:Platform=x64 --no-build --filter "FullyQualifiedName~PackagedExtensionTests"
          --logger "console;verbosity=normal"

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GitVersion reads the commit messages since the start of the history.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Work out the version (GitVersion.yml)
        id: gitversion
        run: |
          dotnet tool restore
          semver="$(dotnet tool run dotnet-gitversion /showvariable SemVer)"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "Version: $semver" >> "$GITHUB_STEP_SUMMARY"
